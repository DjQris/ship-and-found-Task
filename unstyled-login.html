<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dwella — Resident & Admin Sign In (Unstyled / Before System)</title>
</head>
<body>
  <main>
    <section>
      <header>
        <h1>Dwella</h1>
        <p>Residential Estate Service Charge Portal</p>
      </header>

      <form id="login-form">
        <div>
          <label for="identifier">Email or House / Unit ID</label><br />
          <input
            type="text"
            id="identifier"
            name="identifier"
            placeholder="e.g. resident@dwella.ng or Block B, Unit 4"
          />
        </div>
        <br />

        <div>
          <label for="password">Password</label>
          <a href="#forgot">Forgot password?</a><br />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
          />
          <button type="button">Show</button>
        </div>
        <br />

        <div>
          <label>
            <input type="checkbox" id="remember-me" name="remember" />
            Keep me signed in on this device
          </label>
        </div>
        <br />

        <button type="submit">
          Sign In
        </button>
      </form>

      <footer>
        <p>
          Need an account? Contact your estate administrator or management committee.
        </p>
      </footer>
    </section>
  </main>
</body>
</html>
